# Horizontal Pod Autoscaler — scales the stateless pods on load.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bhagya-score
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bhagya-score
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
