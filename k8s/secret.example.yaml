# Example only — do NOT commit real secrets. Create the real one out-of-band, e.g.:
#   kubectl create secret generic bhagya-score-secret \
#     --from-literal=DATABASE_URL='postgres://user:pass@host:5432/db?sslmode=require' \
#     --from-literal=GEMINI_API_KEY='AIza...' \
#     --from-literal=INTERNAL_TOKEN='a-long-random-string'
apiVersion: v1
kind: Secret
metadata:
  name: bhagya-score-secret
type: Opaque
stringData:
  # Any Postgres-compliant database. Add ?sslmode=require for managed instances.
  DATABASE_URL: "postgres://bhagya:bhagya@postgres.default.svc.cluster.local:5432/bhagya"
  # Gemini API key (Google AI Studio) for the nightly content generator.
  GEMINI_API_KEY: "replace-me"
  # Optional: guards POST /internal/generate-content. Leave unset to disable that route.
  INTERNAL_TOKEN: "replace-with-a-long-random-string"
